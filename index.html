<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumo Social</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --msg-other: rgba(30, 41, 59, 0.7);
            --msg-self: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --input-bg: rgba(30, 41, 59, 0.5);
            --danger: #ef4444;
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .glow-1, .glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }
        .glow-1 { width: 450px; height: 450px; background: #6366f1; top: 0%; left: 10%; }
        .glow-2 { width: 500px; height: 500px; background: #a855f7; bottom: 0%; right: 10%; }

        .pfp-slot {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            overflow: hidden;
            flex-shrink: 0;
        }
        .pfp-slot img { width: 100%; height: 100%; object-fit: cover; }

        #auth-screen { 
            position: relative;
            z-index: 1;
            background: var(--card-bg); 
            backdrop-filter: blur(24px);
            padding: 40px 32px; 
            border-radius: 32px; 
            box-shadow: var(--glass-shadow); 
            text-align: center; 
            width: 380px; 
            border: 1px solid var(--card-border); 
        }

        #auth-screen h1 { 
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 34px; 
            font-weight: 800; 
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        #auth-screen p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .avatar-picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .preview-pfp {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            overflow: hidden;
        }
        .preview-pfp img { width: 100%; height: 100%; object-fit: cover; }

        .file-upload-btn {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }

        input, textarea { 
            width: 100%; padding: 14px 18px; margin-bottom: 12px; 
            border: 1px solid var(--card-border); border-radius: 16px; 
            background: var(--input-bg); color: var(--text-main); font-size: 14px; outline: none; 
        }
        input:focus, textarea:focus { border-color: var(--primary); }

        button { 
            width: 100%; padding: 14px; background: var(--primary-gradient); 
            color: white; border: none; border-radius: 16px; 
            cursor: pointer; font-weight: 700; font-size: 14px; 
            transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-2px); }

        #app-screen { 
            display: none; 
            position: relative;
            z-index: 1;
            width: 1000px; 
            height: 720px; 
            background: var(--card-bg); 
            backdrop-filter: blur(24px);
            border-radius: 32px; 
            box-shadow: var(--glass-shadow); 
            border: 1px solid var(--card-border); 
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-brand-title {
            font-weight: 800;
            font-size: 18px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 10px;
            color: var(--text-main); 
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .user-profile-bar {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info-text { display: flex; flex-direction: column; }
        .user-info-text .name { font-weight: 700; font-size: 14px; }
        .user-info-text .jumo-num { font-size: 11px; color: var(--text-muted); }

        .navigation-tabs {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .tab-btn {
            padding: 10px 14px;
            border-radius: 12px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .chat-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .chat-item:hover, .chat-item.active { background: rgba(255, 255, 255, 0.08); }
        .chat-item .chat-details { flex: 1; overflow: hidden; }
        .chat-item .chat-name { font-weight: 700; font-size: 13px; }
        .chat-item .chat-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .follow-btn {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            width: auto;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .content-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-header .active-title { font-weight: 800; font-size: 18px; }

        .feed-container {
            flex: 1; padding: 24px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px;
        }

        .create-post-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .create-post-box textarea {
            resize: none;
            height: 70px;
            margin-bottom: 0;
            background: rgba(15, 23, 42, 0.6);
        }

        .post-actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-actions-bar button { width: auto; padding: 8px 20px; font-size: 12px; }

        .post-card {
            background: var(--msg-other);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-header .author-info { display: flex; flex-direction: column; }
        .post-header .author-name { font-weight: 700; font-size: 13px; }
        .post-header .post-time { font-size: 10px; color: var(--text-muted); }

        .post-body { font-size: 14px; line-height: 1.5; color: var(--text-main); word-break: break-word; }

        .post-footer {
            display: flex;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .interaction-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0;
            width: auto;
        }
        .interaction-btn:hover { color: var(--primary); transform: none; }

        .chat-messages {
            flex: 1; padding: 24px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }

        .message-row { display: flex; gap: 10px; max-width: 75%; align-self: flex-start; }
        .message-row.self { align-self: flex-end; flex-direction: row-reverse; }

        .message-bubble {
            background: var(--msg-other);
            padding: 12px 16px; border-radius: 18px;
            font-size: 14px; line-height: 1.4; border: 1px solid var(--card-border);
            word-break: break-word;
        }

        .message-row.self .message-bubble { background: var(--msg-self); border: none; }
        .message-bubble .author { font-size: 11px; font-weight: 700; opacity: 0.8; display: block; margin-bottom: 4px; }
        .message-bubble .time { font-size: 10px; opacity: 0.6; display: block; margin-top: 4px; text-align: right; }

        .chat-input {
            padding: 16px 24px; border-top: 1px solid var(--card-border);
            display: flex; gap: 10px; background: rgba(0, 0, 0, 0.1);
        }

        .chat-input input { margin-bottom: 0; border-radius: 24px; }
        .chat-input button { width: auto; padding: 0 24px; border-radius: 24px; }

        #group-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            z-index: 10; justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 30px; border-radius: 24px; width: 340px; text-align: center;
        }
        .modal-content h3 { margin-bottom: 16px; font-weight: 800; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button.cancel { background: var(--danger); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div id="auth-screen">
        <h1>Jumo Social</h1>
        <p>Enter your profile details to sign in</p>

        <div class="avatar-picker-container">
            <div class="preview-pfp" id="pfp-preview-box">No PFP</div>
            <label class="file-upload-btn">
                Upload Profile Picture
                <input type="file" accept="image/*" style="display: none;" onchange="handlePfpUpload(event)">
            </label>
        </div>

        <input type="text" id="username-input" placeholder="Your Name">
        <input type="text" id="jumo-num-input" placeholder="4-Digit Jumo Number (e.g. 7842)" maxlength="4">
        <input type="password" id="passcode-input" placeholder="Room Passcode">
        <button onclick="login()">Enter App</button>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-brand-title">Jumo Social</span>
                <button class="nav-btn" onclick="openGroupModal()">+ Group</button>
            </div>
            
            <div class="user-profile-bar">
                <div class="pfp-slot" id="my-pfp-slot">PFP</div>
                <div class="user-info-text">
                    <span class="name" id="my-username">User</span>
                    <span class="jumo-num" id="my-jumo-num">#0000</span>
                </div>
            </div>

            <div class="navigation-tabs">
                <button class="tab-btn active" id="tab-feed" onclick="switchView('feed')">Public Feed</button>
                <button class="tab-btn" id="tab-chats" onclick="switchView('chats')">Messages & Groups</button>
                <button class="tab-btn" id="tab-settings" onclick="switchView('settings')">Settings</button>
            </div>

            <div class="chat-list" id="sidebar-list"></div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="pfp-slot" id="active-header-pfp" style="display: none;">PFP</div>
                    <span class="active-title" id="active-header-title">Public Feed</span>
                </div>
                <div id="feed-sort-controls">
                    <button class="nav-btn" onclick="loadPosts('recent')">Latest</button>
                    <button class="nav-btn" onclick="loadPosts('popular')">Trending</button>
                </div>
            </div>

            <!-- Feed View -->
            <div id="feed-view" class="feed-container">
                <div class="create-post-box">
                    <textarea id="post-input" placeholder="Share updates, links, or media..."></textarea>
                    <div class="post-actions-bar">
                        <span style="font-size: 11px; color: var(--text-muted);">Real-time broadcast</span>
                        <button onclick="publishPost()">Publish Post</button>
                    </div>
                </div>
                <div id="posts-stream" style="display: flex; flex-direction: column; gap: 16px;"></div>
            </div>

            <!-- Chat View -->
            <div id="chat-view" style="display: none; flex: 1; flex-direction: column; height: 100%;">
                <div class="chat-messages" id="messages-container"></div>
                <div class="chat-input">
                    <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" style="display: none; flex: 1; padding: 30px; flex-direction: column; gap: 20px;">
                <h2>Account Settings</h2>
                
                <div>
                    <label style="display:block; margin-bottom:8px; font-size:14px;">Update Display Name</label>
                    <input type="text" id="update-name-input" placeholder="New display name">
                </div>

                <div>
                    <label style="display:block; margin-bottom:8px; font-size:14px;">Update Profile Picture</label>
                    <label class="file-upload-btn">
                        Choose New File
                        <input type="file" accept="image/*" style="display: none;" onchange="handlePfpUpload(event)">
                    </label>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 10px;">
                    <button onclick="saveSettings()" style="width: 180px;">Save Changes</button>
                    <button onclick="logout()" style="width: 180px; background: var(--danger);">Log Out</button>
                </div>
            </div>
        </div>

        <div id="group-modal">
            <div class="modal-content">
                <h3>Create Community Group</h3>
                <input type="text" id="group-name-input" placeholder="Group Name">
                <div class="modal-buttons">
                    <button onclick="createGroup()">Create</button>
                    <button class="cancel" onclick="closeGroupModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6g0xgSfNaIdYx6XVKgUI0zoJrcjrX8eE",
            authDomain: "jumo-5ef47.firebaseapp.com",
            databaseURL: "https://jumo-5ef47-default-rtdb.firebaseio.com",
            projectId: "jumo-5ef47",
            storageBucket: "jumo-5ef47.firebasestorage.app",
            messagingSenderId: "981067949961",
            appId: "1:981067949961:web:ad0b0c5218b2bd257e2358"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = "";
        let currentJumoNum = "";
        let profilePicData = "";
        let roomPasscode = "1234";
        let activeChatId = "main-lounge";
        let currentView = "feed";
        let followingUsers = [];
        let chatsCache = {};
        let usersCache = {};

        database.ref("roomConfig/passcode").on("value", snapshot => {
            if (snapshot.exists()) roomPasscode = snapshot.val();
        });

        // Resize images client-side to keep base64 sizes safe for Firebase nodes
        function handlePfpUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 128;
                        canvas.height = 128;
                        ctx.drawImage(img, 0, 0, 128, 128);
                        profilePicData = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById("pfp-preview-box").innerHTML = `<img src="${profilePicData}" alt="PFP">`;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function login() {
            const enteredPass = document.getElementById("passcode-input").value;
            const enteredName = document.getElementById("username-input").value.trim();
            const enteredJumoNum = document.getElementById("jumo-num-input").value.trim();

            if (enteredPass !== roomPasscode) {
                alert("Invalid Room Passcode!");
                return;
            }

            if (enteredName === "" || !/^\d{4}$/.test(enteredJumoNum)) {
                alert("Please enter a valid Name and a 4-digit Jumo Number!");
                return;
            }

            database.ref("jumoNumbers/" + enteredJumoNum).once("value", snapshot => {
                if (snapshot.exists() && snapshot.val() !== enteredName) {
                    alert("This 4-digit Jumo Number is already taken!");
                } else {
                    currentUser = enteredName;
                    currentJumoNum = enteredJumoNum;

                    database.ref("jumoNumbers/" + currentJumoNum).set(currentUser);
                    database.ref("users/" + currentUser).set({
                        jumoNum: currentJumoNum,
                        pfp: profilePicData
                    });

                    document.getElementById("my-username").textContent = currentUser;
                    document.getElementById("my-jumo-num").textContent = "#" + currentJumoNum;
                    
                    if (profilePicData) {
                        document.getElementById("my-pfp-slot").innerHTML = `<img src="${profilePicData}" alt="PFP">`;
                    }

                    document.getElementById("auth-screen").style.display = "none";
                    document.getElementById("app-screen").style.display = "flex";

                    listenForNetworkAndChats();
                    loadPosts('recent');
                }
            });
        }

        function switchView(view) {
            currentView = view;
            document.getElementById("tab-feed").classList.toggle("active", view === 'feed');
            document.getElementById("tab-chats").classList.toggle("active", view === 'chats');
            document.getElementById("tab-settings").classList.toggle("active", view === 'settings');

            document.getElementById("feed-view").style.display = view === 'feed' ? 'flex' : 'none';
            document.getElementById("chat-view").style.display = view === 'chats' ? 'flex' : 'none';
            document.getElementById("settings-view").style.display = view === 'settings' ? 'flex' : 'none';

            if (view === 'feed') {
                document.getElementById("active-header-title").textContent = "Public Feed";
                document.getElementById("active-header-pfp").style.display = "none";
                document.getElementById("feed-sort-controls").style.display = "block";
                loadPosts('recent');
            } else if (view === 'chats') {
                document.getElementById("feed-sort-controls").style.display = "none";
                switchChat("main-lounge", "Main Lounge", "");
            } else if (view === 'settings') {
                document.getElementById("active-header-title").textContent = "Account Settings";
                document.getElementById("active-header-pfp").style.display = "none";
                document.getElementById("feed-sort-controls").style.display = "none";
                document.getElementById("update-name-input").value = currentUser;
            }
        }

        function saveSettings() {
            const newName = document.getElementById("update-name-input").value.trim();

            if (newName !== "" && newName !== currentUser) {
                database.ref("users/" + currentUser).remove();
                currentUser = newName;
                database.ref("jumoNumbers/" + currentJumoNum).set(currentUser);
            }

            database.ref("users/" + currentUser).set({
                jumoNum: currentJumoNum,
                pfp: profilePicData
            });

            document.getElementById("my-username").textContent = currentUser;
            if (profilePicData) {
                document.getElementById("my-pfp-slot").innerHTML = `<img src="${profilePicData}" alt="PFP">`;
            }

            alert("Settings updated successfully!");
        }

        function logout() {
            window.location.reload();
        }

        function publishPost() {
            const input = document.getElementById("post-input");
            const text = input.value.trim();
            if (text === "") return;

            database.ref("posts").push({
                author: currentUser,
                jumoNum: currentJumoNum,
                pfp: profilePicData,
                content: text,
                timestamp: Date.now(),
                likes: 0
            });

            input.value = "";
        }

        function loadPosts(sortType) {
            const stream = document.getElementById("posts-stream");
            database.ref("posts").off();
            database.ref("posts").on("value", snapshot => {
                stream.innerHTML = "";
                if (!snapshot.exists()) return;

                let posts = [];
                snapshot.forEach(child => {
                    posts.push({ id: child.key, ...child.val() });
                });

                if (sortType === 'popular') {
                    posts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                } else {
                    posts.sort((a, b) => b.timestamp - a.timestamp);
                }

                posts.forEach(post => {
                    const postCard = document.createElement("div");
                    postCard.className = "post-card";
                    const pfpHTML = post.pfp ? `<img src="${post.pfp}" alt="PFP">` : `PFP`;

                    postCard.innerHTML = `
                        <div class="post-header">
                            <div class="pfp-slot">${pfpHTML}</div>
                            <div class="author-info">
                                <span class="author-name">${post.author} #${post.jumoNum || '0000'}</span>
                                <span class="post-time">${new Date(post.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="post-body">${escapeHTML(post.content)}</div>
                        <div class="post-footer">
                            <button class="interaction-btn" onclick="likePost('${post.id}', ${post.likes || 0})">
                                Like (${post.likes || 0})
                            </button>
                            <button class="interaction-btn" onclick="sharePost('${post.id}')">
                                Share
                            </button>
                        </div>
                    `;
                    stream.appendChild(postCard);
                });
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function likePost(postId, currentLikes) {
            database.ref("posts/" + postId + "/likes").set(currentLikes + 1);
        }

        function sharePost(postId) {
            const shareUrl = window.location.href.split('#')[0] + '?post=' + postId;
            navigator.clipboard.writeText(shareUrl);
            alert("Sharable link copied to clipboard!");
        }

        function listenForNetworkAndChats() {
            database.ref("chats").on("value", snapshot => {
                chatsCache = snapshot.exists() ? snapshot.val() : {};
                renderSidebar();
            });

            database.ref("users").on("value", snapshot => {
                usersCache = snapshot.exists() ? snapshot.val() : {};
                renderSidebar();
            });
        }

        function renderSidebar() {
            const list = document.getElementById("sidebar-list");
            list.innerHTML = "";

            addChatToList("main-lounge", "Main Lounge", "", "Public Channel");

            Object.keys(chatsCache).forEach(key => {
                const chat = chatsCache[key];
                addChatToList(key, chat.name, "", "Group Chat");
            });

            Object.keys(usersCache).forEach(username => {
                if (username !== currentUser) {
                    const userObj = usersCache[username];
                    const dmId = [currentUser, username].sort().join("_dm_");
                    addNetworkUserToList(dmId, username, userObj.pfp || "", "#" + userObj.jumoNum);
                }
            });
        }

        function addChatToList(id, name, pfp, subtext) {
            const list = document.getElementById("sidebar-list");
            const item = document.createElement("div");
            item.className = "chat-item " + (activeChatId === id ? "active" : "");
            item.onclick = () => {
                switchView('chats');
                switchChat(id, name, pfp);
            };

            const pfpHTML = pfp ? `<img src="${pfp}" alt="PFP">` : `PFP`;

            item.innerHTML = `
                <div class="pfp-slot">${pfpHTML}</div>
                <div class="chat-details">
                    <div class="chat-name">${name}</div>
                    <div class="chat-sub">${subtext}</div>
                </div>
            `;
            list.appendChild(item);
        }

        function addNetworkUserToList(id, name, pfp, subtext) {
            const list = document.getElementById("sidebar-list");
            const item = document.createElement("div");
            item.className = "chat-item";

            const pfpHTML = pfp ? `<img src="${pfp}" alt="PFP">` : `PFP`;
            const isFollowing = followingUsers.includes(name);

            item.innerHTML = `
                <div class="pfp-slot">${pfpHTML}</div>
                <div class="chat-details" onclick="switchView('chats'); switchChat('${id}', '${name}', '${pfp}');">
                    <div class="chat-name">${name}</div>
                    <div class="chat-sub">${subtext}</div>
                </div>
                <button class="follow-btn" onclick="toggleFollow('${name}')">${isFollowing ? 'Following' : 'Follow'}</button>
            `;
            list.appendChild(item);
        }

        function toggleFollow(username) {
            if (followingUsers.includes(username)) {
                followingUsers = followingUsers.filter(u => u !== username);
            } else {
                followingUsers.push(username);
            }
            renderSidebar();
        }

        function switchChat(chatId, name, pfp) {
            activeChatId = chatId;
            document.getElementById("active-header-title").textContent = name;
            
            const activePfpContainer = document.getElementById("active-header-pfp");
            activePfpContainer.style.display = "flex";
            activePfpContainer.innerHTML = pfp ? `<img src="${pfp}" alt="PFP">` : `PFP`;

            const messagesContainer = document.getElementById("messages-container");
            messagesContainer.innerHTML = "";

            database.ref("messages/" + activeChatId).off();
            database.ref("messages/" + activeChatId).on("child_added", snapshot => {
                const msg = snapshot.val();
                const row = document.createElement("div");
                const isSelf = msg.sender === currentUser;

                const msgPfpHTML = msg.pfp ? `<img src="${msg.pfp}" alt="PFP">` : `PFP`;

                row.className = "message-row " + (isSelf ? "self" : "");
                row.innerHTML = `
                    <div class="pfp-slot">${msgPfpHTML}</div>
                    <div class="message-bubble">
                        <span class="author">${msg.sender} #${msg.jumoNum || '0000'}</span>
                        <div>${escapeHTML(msg.text)}</div>
                        <span class="time">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                `;
                messagesContainer.appendChild(row);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (text === "") return;

            database.ref("messages/" + activeChatId).push({
                sender: currentUser,
                jumoNum: currentJumoNum,
                pfp: profilePicData,
                text: text,
                timestamp: Date.now()
            });

            input.value = "";
        }

        function openGroupModal() { document.getElementById("group-modal").style.display = "flex"; }
        function closeGroupModal() { document.getElementById("group-modal").style.display = "none"; }

        function createGroup() {
            const name = document.getElementById("group-name-input").value.trim();

            if (name !== "") {
                const newChatRef = database.ref("chats").push();
                newChatRef.set({ name: name, createdBy: currentUser });
                closeGroupModal();
                document.getElementById("group-name-input").value = "";
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
